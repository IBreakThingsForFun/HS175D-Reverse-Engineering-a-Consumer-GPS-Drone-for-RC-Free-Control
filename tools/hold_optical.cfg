# hold_optical.cfg  -- continuously force the optical-mode SRAM flag set on a RUNNING MM32F103.
# MINIMAL VALIDATED SET (memory optical-mode-gate, 2026-06-28 "objective met" run): 10 discrete
# mode-flags ONLY. Do NOT add the float/control bytes (0x4af/0x4b3/0x4c7/0xbc0 etc.) -- freezing
# the firmware's live control math triggers a hybrid-state ALARM (beeping). Less is more here.
#
# Run (Pico debugprobe / CMSIS-DAP, props OFF, FC on its own battery):
#   openocd -f interface/cmsis-dap.cfg -c "transport select swd" -f target/stm32f1x.cfg \
#           -f tools/hold_optical.cfg -c init -c hold_optical
#
# Writes go to the RUNNING target via the debug AP (no halt). Firmware reverts some one-shots,
# so we re-write the set every ~20ms = "hold". Ctrl-C to release. NEVER 'stm32f1x unlock'.
#
# NOTE: holding optical mode only sets the CONTROL LAW. Motor START still needs the explicit
# takeoff command (DebugBus: send?idx=6&val=02), NOT raw throttle.

set HOLD_MS 20

proc hold_optical {} {
    global HOLD_MS
    echo "optical-mode hold: forcing 10 minimal flag bytes every $HOLD_MS ms (Ctrl-C to release)"
    set i 0
    while {1} {
        mwb 0x2000010d 0x00   ;# ff->00
        mwb 0x2000010e 0x00   ;# ff->00
        mwb 0x2000010f 0x00   ;# ff->00
        mwb 0x2000011f 0x00   ;# 01->00
        mwb 0x20000230 0x01   ;# 00->01  (mode enum anchor)
        mwb 0x200006c2 0x05   ;# 00->05
        mwb 0x200006cb 0x05   ;# 00->05
        mwb 0x20000730 0x00   ;# ff->00  (was the hybrid culprit if left ff)
        mwb 0x20000731 0x00   ;# ff->00
        mwb 0x20000bad 0x02   ;# 01->02  (mode enum 1=GPS/2=optical)
        sleep $HOLD_MS
        incr i
        if {$i % 50 == 0} { echo "hold #$i  230=[format %02x [mrb 0x20000230]] bad=[format %02x [mrb 0x20000bad]] (expect 01/02)" }
    }
}
