# force_arm.cfg -- test whether the ARM-signature bytes are LATCHED (forceable) or RECOMPUTED (revert).
# Derived from the 2026-06-28 real-SWD locked->unlocked diff (dumps/rc2lock vs rc2unlock).
# Writes the arm set ONCE, then reads back repeatedly WITHOUT rewriting -> if values hold, they're
# latched (firmware not recomputing them) and SWD-arming may be viable with RC OFF; if they revert,
# they're outputs like the mode bytes (dead end, same as the mode-hold negative).
#
# Run (RC OFF, drone freshly booted/locked, props OFF):
#   openocd -f interface/cmsis-dap.cfg -c "transport select swd" -f target/stm32f1x.cfg \
#           -f tools/force_arm.cfg -c init -c force_arm
#
# If it STICKS, switch to continuous hold: -c hold_arm  (rewrites every 20ms like hold_optical).

proc _wr {} {
    mwb 0x20000017 0x01
    mwb 0x20000032 0x1c
    mwb 0x20000033 0x02
    mwb 0x2000017b 0xc5
    mwb 0x20000188 0x05
    mwb 0x200001be 0x04
    mwb 0x200001bf 0x06
    mwb 0x2000021c 0x01
    mwb 0x20000231 0x00
    mwb 0x20000492 0x00
    mwb 0x20000493 0x00
    mwb 0x20000bb5 0x02
}
proc _rd {tag} {
    echo "$tag 17=[format %02x [mrb 0x20000017]] 33=[format %02x [mrb 0x20000033]] 188=[format %02x [mrb 0x20000188]] 21c=[format %02x [mrb 0x2000021c]] bb5=[format %02x [mrb 0x20000bb5]] 492=[format %02x [mrb 0x20000492]]"
}

proc force_arm {} {
    _rd "PRE  "
    _wr
    _rd "WROTE"
    for {set k 0} {$k < 10} {incr k} { sleep 300; _rd "T+[expr {($k+1)*300}]ms" }
    echo "done -- if values match WROTE, they latched; if back to PRE, firmware reverted."
}

proc hold_arm {} {
    echo "arm hold: rewriting 12 arm bytes every 20ms (Ctrl-C to release)"
    set i 0
    while {1} { _wr; sleep 20; incr i; if {$i % 50 == 0} { _rd "hold #$i" } }
}
