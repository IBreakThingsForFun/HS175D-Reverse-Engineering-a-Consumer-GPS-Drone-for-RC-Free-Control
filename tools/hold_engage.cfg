# hold_engage.cfg -- hold the DISCRETE engage-state flags (from diff_b0_idling, 2026-06-29)
# so the FC stays in the motors-idling engaged state when the RC link drops = RC-free retention test.
# Excludes ALL live-float arrays (0x32f-0x3e7, 0x4af-0x4cb, 0x8a3-0x93f, 0xbcb-0xc77) and counters
# (0x0/0x9/0x24-0x2c/timers) -- holding those triggers the hybrid alarm. Discrete flags only.
# Run: openocd -f interface/cmsis-dap.cfg -c "transport select swd" -f target/stm32f1x.cfg \
#              -f tools/hold_engage.cfg -c init -c hold_engage     (Ctrl-C / kill to release)
set HOLD_MS 20
proc hold_engage {} {
    global HOLD_MS
    echo "engage-state hold: forcing discrete flags every $HOLD_MS ms (Ctrl-C to release)"
    set i 0
    while {1} {
        mwb 0x20000017 0x01 ; mwb 0x20000018 0x02
        mwb 0x2000001e 0xb1 ; mwb 0x2000001f 0x06
        mwb 0x2000011f 0x01
        mwb 0x2000018e 0xf4 ; mwb 0x2000018f 0xff ; mwb 0x200001c3 0xff
        mwb 0x2000021b 0x40 ; mwb 0x2000021c 0x01 ; mwb 0x20000220 0x00
        mwb 0x20000230 0x01 ; mwb 0x20000231 0x00 ; mwb 0x20000232 0x00
        mwb 0x20000234 0x00 ; mwb 0x20000255 0x00
        mwb 0x20000443 0x04
        mwb 0x20000492 0x00 ; mwb 0x20000493 0x00
        mwb 0x20000558 0x4a ; mwb 0x20000559 0x10 ; mwb 0x2000055a 0x02
        mwb 0x2000055b 0x03 ; mwb 0x2000055c 0x04 ; mwb 0x2000055d 0x05
        mwb 0x2000055e 0x06 ; mwb 0x2000055f 0x07 ; mwb 0x20000560 0x08 ; mwb 0x20000561 0xa8
        mwb 0x2000071c 0x08 ; mwb 0x20000720 0x06 ; mwb 0x20000724 0x09
        mwb 0x20000941 0x00
        mwb 0x20000bad 0x02 ; mwb 0x20000bb5 0x02
        mwb 0x2000010d 0x00 ; mwb 0x2000010e 0x00 ; mwb 0x2000010f 0x00
        mwb 0x200006c2 0x05 ; mwb 0x200006cb 0x05
        mwb 0x20000730 0x00 ; mwb 0x20000731 0x00
        sleep $HOLD_MS
        incr i
        if {$i % 50 == 0} { echo "hold #$i bad=[format %02x [mrb 0x20000bad]] s558=[format %02x [mrb 0x20000558]]" }
    }
}
