# no_idleoff.cfg -- defeat the ~25s idle-disarm by pinning the countdown timers above zero.
# Found 2026-06-29 via 3-snapshot monotonic hunt (idt0/1/2): 0x11f counts 2->1->0 at disarm,
# with a cluster 0x123/0x127/0x128/0x12d decrementing alongside. Pin all >0 every 20ms.
# Run: openocd -f interface/cmsis-dap.cfg -c "transport select swd" -f target/stm32f1x.cfg \
#              -f tools/no_idleoff.cfg -c init -c no_idleoff       (Ctrl-C / kill to release)
set HOLD_MS 20
proc no_idleoff {} {
    global HOLD_MS
    echo "idle-off defeat: pinning disarm countdowns every $HOLD_MS ms (Ctrl-C to release)"
    set i 0
    while {1} {
        mwb 0x2000011f 0x05
        mwb 0x20000123 0x30
        mwb 0x20000127 0x3f
        mwb 0x20000128 0x3f
        mwb 0x2000012d 0x10
        mwb 0x20000275 0x08
        sleep $HOLD_MS
        incr i
        if {$i % 50 == 0} { echo "alive #$i  11f=[format %02x [mrb 0x2000011f]]" }
    }
}
